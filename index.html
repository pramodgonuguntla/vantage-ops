// ─── ITEM 2: Week utilities (Sun-Sat, W1 = week containing Jan 1) ─────────────
function getWeekBounds(year, weekNum) {
  // Jan 1 of given year
  const jan1 = new Date(year, 0, 1);
  // W1 starts on the Sunday on or before Jan 1
  const jan1Day = jan1.getDay(); // 0=Sun
  const w1Start = new Date(year, 0, 1 - jan1Day);
  // weekNum is 1-based
  const start = new Date(w1Start);
  start.setDate(w1Start.getDate() + (weekNum - 1) * 7);
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  return { start, end };
}

function getAllWeeksOfYear(year) {
  const today = new Date();
  today.setHours(0,0,0,0);
  const weeks = [];
  let w = 1;
  while (true) {
    const { start, end } = getWeekBounds(year, w);
    if (start.getFullYear() > year && w > 1) break;
    if (start.getFullYear() > year + 1) break;
    // Only include weeks that have ended (end < today)
    if (end >= today) break;
    // Only include weeks that belong to this year (start or end in this year)
    if (start.getFullYear() > year) break;
    weeks.push({ weekNum: w, start, end });
    w++;
    if (w > 54) break;
  }
  return weeks;
}

function getLastFullWeek() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const year = today.getFullYear();
  const weeks = getAllWeeksOfYear(year);
  return weeks.length > 0 ? weeks[weeks.length - 1] : null;
}

const fmtDateFull = d => d.toLocaleDateString("en-IN", {day:"2-digit",month:"short",year:"numeric"});

const getUnit = m => NO_PCT.has(m) ? "" : "%";
const minsToHHMM = v => { const n=Math.round(Math.abs(Number(v)||0)); return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0"); };

// ITEM 4: Unified format function with proper decimal rules
function fmt(v, m) {
  if (v == null) return "—";
  const n = Number(v);
  if (CURRENCY.has(m)) {
    // Show decimals only if present in underlying data
    const hasDecimal = n !== Math.floor(n);
    return "₹" + (hasDecimal ? n.toFixed(2) : Math.round(n)).toLocaleString("en-IN");
  }
  if (TIME_METRIC.has(m)) return minsToHHMM(v);
  if (INTEGER_METRICS.has(m)) return Math.round(n).toString();
  if (BREACH_METRICS.has(m)) return n.toFixed(2) + "%";
  if (TWO_DECIMAL_ABS.has(m)) return n.toFixed(2) + getUnit(m);
  if (!NO_PCT.has(m)) return n.toFixed(1) + "%"; // all other % metrics: 1dp
  return n.toFixed(2) + getUnit(m); // fallback 2dp for other abs
}

function fmtVar(v, m) {
  if (v === null) return null;
  const n = Number(v);
  if (CURRENCY.has(m)) {
    const hasDecimal = Math.abs(n) !== Math.floor(Math.abs(n));
    return (n >= 0 ? "+₹" : "-₹") + Math.abs(hasDecimal ? parseFloat(n.toFixed(2)) : Math.round(n)).toLocaleString("en-IN");
  }
  if (TIME_METRIC.has(m)) return (n >= 0 ? "+" : "-") + minsToHHMM(v);
  return (n > 0 ? "+" : "") + n + getUnit(m);
}

// Chart format (same rules, for tooltips/labels)

  if (CURRENCY.has(m)) { const hd = n !== Math.floor(n); return "₹" + (hd ? n.toFixed(2) : Math.round(n)).toLocaleString("en-IN"); }
  if (INTEGER_METRICS.has(m)) return Math.round(n).toString();
  if (BREACH_METRICS.has(m)) return n.toFixed(2) + "%";
  if (TWO_DECIMAL_ABS.has(m)) return n.toFixed(2) + getUnit(m);
  if (!NO_PCT.has(m)) return n.toFixed(1) + "%";
  return n.toFixed(2) + getUnit(m);
}

function getDateRange(period, cr, weekSel) {
  const now = new Date(); const yesterday = new Date(now); yesterday.setDate(now.getDate()-1);
  if (period==="Daily") { const f=new Date(yesterday); f.setHours(0,0,0,0); const t=new Date(yesterday); t.setHours(23,59,59,999); return {from:f,to:t}; }
  // ITEM 2: Weekly uses selected week bounds
  if (period==="Weekly") {
    if (weekSel) {
      const f = new Date(weekSel.start); f.setHours(0,0,0,0);
      const t = new Date(weekSel.end); t.setHours(23,59,59,999);
      return {from:f,to:t};
    }
    const lfw = getLastFullWeek();
    if (lfw) { const f=new Date(lfw.start);f.setHours(0,0,0,0);const t=new Date(lfw.end);t.setHours(23,59,59,999);return{from:f,to:t}; }
  }
  const to=new Date(now); to.setHours(23,59,59,999); const from=new Date(now);
  if (period==="MTD") { from.setDate(1); from.setHours(0,0,0,0); return {from,to}; }
  if (period==="YTD") { from.setMonth(0,1); from.setHours(0,0,0,0); return {from,to}; }
  if (period==="Custom"&&cr?.from&&cr?.to) return {from:new Date(cr.from),to:new Date(cr.to+" 23:59:59")};
  return {from:new Date(0),to};
}

const parseDate = val => { if(!val) return null; const num=Number(val); if(!isNaN(num)&&num>40000) return new Date((num-25569)*86400*1000); const d=new Date(val); return isNaN(d)?null:d; };
const parseDateToStr = val => { const d=parseDate(val); return d ? d.toISOString().split("T")[0] : null; };

  });
}

function buildHierarchyFromUsers(rows) {
  if(!rows||!rows.length) return null; const nodes={};
  rows.forEach(r => { const id=emailToId(r.Emp_Email); if(!nodes[id]) nodes[id]={name:r.Emp_Name,title:r.Emp_Designation,label:r.Emp_Designation,email:r.Emp_Email,children:[]}; const mid=emailToId(r.Manager_Email); if(r.Manager_Email&&!nodes[mid]) nodes[mid]={name:r.Manager_Name,title:r.Manager_Designation,label:r.Manager_Designation,email:r.Manager_Email,children:[]}; });
  rows.forEach(r => { const eid=emailToId(r.Emp_Email),mid=emailToId(r.Manager_Email); if(r.Manager_Email&&mid!==eid&&!nodes[mid].children.includes(eid)) nodes[mid].children.push(eid); });
  return nodes;
}

const buildHIHubMap = rows => { const map={}; rows.forEach(r => { const id=(r.HI_Email||"").toLowerCase().trim(); if(!map[id]) map[id]=[]; map[id].push({hub:r.Hub_Name,facilityId:r.Facility_ID}); }); return map; };

function getFacilitiesForNode(nodeId, hierarchy, hiHubMap) {
  const node=hierarchy[nodeId]; if(!node) return [];
  if(!node.children.length) { const e=(node.email||"").toLowerCase().trim(); return (hiHubMap[e]||[]).map(h=>h.facilityId); }
  return node.children.flatMap(cid => getFacilitiesForNode(cid,hierarchy,hiHubMap));
}

// Non-leaf descendant levels grouped by TITLE (not depth).
// This ensures ZM/RM/AM each get exactly one dropdown regardless of uneven hierarchy depth.
function getNonLeafDescendantLevels(nodeId, hier) {
  // Walk the entire subtree, collect all non-leaf nodes
  const allManagers = []; // {id, name, title, label}
  function walk(id) {
    const n = hier[id];
    if (!n) return;
    const kids = (n.children||[]).filter(c=>hier[c]);
    if (kids.length > 0) {
      allManagers.push({ id, name: n.name, title: n.title, label: n.label });
      kids.forEach(walk);
    }
  }
  const root = hier[nodeId];
  if (!root) return [];
  (root.children||[]).filter(c=>hier[c]).forEach(walk);

  // Group by title, preserving first-seen order of titles
  const titleOrder = [];
  const titleMap = {}; // title -> [{id, name, title, label}]
  allManagers.forEach(m => {
    const t = m.title || "Unknown";
    if (!titleMap[t]) { titleMap[t] = []; titleOrder.push(t); }
    // Deduplicate by id within each title group
    if (!titleMap[t].find(x => x.id === m.id)) titleMap[t].push(m);
  });

  return titleOrder.map(t => ({ title: t, nodes: titleMap[t] }));
}

// Get all leaf HI nodes under a given nodeId, with hub names from hiMap
function getLeafHubsUnder(nodeId, hier, hiMap) {
  const results = [];
  function walk(id) {
    const n = hier[id];
    if (!n) return;
    const kids = (n.children||[]).filter(c=>hier[c]);
    if (kids.length === 0) {
      const email = (n.email||"").toLowerCase().trim();
      const hubs = hiMap[email] || [];
      if (hubs.length) {
        hubs.forEach(h => results.push({ nodeId: id, hiName: n.name, hubName: h.hub, facilityId: h.facilityId }));
      } else {
        results.push({ nodeId: id, hiName: n.name, hubName: n.name, facilityId: null });
      }
    } else {
      kids.forEach(walk);
    }
  }
  walk(nodeId);
  const seen = new Set();
  return results.filter(r => { const k=r.nodeId+"|"+r.hubName; if(seen.has(k)) return false; seen.add(k); return true; });
}

const isRowBlank = (r, numericCols) => numericCols.every(c => !r[c]||Number(r[c])===0||String(r[c]).trim()==="");

function filterRows(rows, fids, dr, numericCols) {
  return rows.filter(r => {
    const d=parseDate(r.Date); if(!d) return false;
    if(!fids.has(String(r.Facility_ID||"").trim())) return false;
    if(d<dr.from||d>dr.to) return false;
    if(numericCols&&isRowBlank(r,numericCols)) return false;
    return true;
  });
}

function resolveTarget(metricName, facilityId, dateStr, targetRaw, adminTargets) {
  if(targetRaw&&targetRaw.length) {
    const fid=String(facilityId).trim();
    const match=targetRaw.find(r => {
      if(String(r.Facility_ID).trim()!==fid) return false;
      if(String(r.Metric_Name).trim()!==metricName) return false;
      if(!r.Effective_From||!r.Effective_To) return true;
      const ef=parseDateToStr(r.Effective_From), et=parseDateToStr(r.Effective_To);
      if(!ef||!et) return true;
      return dateStr>=ef&&dateStr<=et;
    });
    if(match) return Number(match.Target_Value)||0;
  }
  if(adminTargets&&adminTargets[metricName]!=null) return adminTargets[metricName];
  return null;
}

function resolveTargetForFids(metricName, fids, dateStr, targetRaw, adminTargets) {
  const vals=[...fids].map(fid=>resolveTarget(metricName,fid,dateStr,targetRaw,adminTargets)).filter(v=>v!==null);
  if(!vals.length) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10;
}

// ─── Compute functions ────────────────────────────────────────────────────────
function computeReliability(rows, fids, dateStr, tR, aT) {
  if(!rows.length) return null;
  const n=k=>rows.reduce((s,r)=>s+(Number(r[k])||0),0);
  const pct=(a,b)=>b?Math.round(a/b*10000)/100:null; // 2dp for breach
  const w=(v,m)=>{ if(v===null) return null; return {actual:v,target:resolveTargetForFids(m,fids,dateStr,tR,aT)}; };
  const bB=n("Breach_Base"), nP=pct(n("NCD_Breach_Actual"),bB), cP=pct(n("CD_Breach_Actual"),bB);
  const ipd2Base = n("IPD2_Base");
  const ipd2Actual = n("IPD2_Actual");
  const ipd2Clearance = ipd2Base ? Math.round((1 - ipd2Actual/ipd2Base)*10000)/100 : null;
  return {
    "NCD Breach": w(nP,"NCD Breach"),
    "CD Breach": w(cP,"CD Breach"),
    "Total Breach": (nP!==null&&cP!==null)?w(Math.round((nP+cP)*100)/100,"Total Breach"):null,
    "Repromise Breach": w(pct(n("Repromise_Breach_Actual"),n("Repromise_Breach_Base")),"Repromise Breach"),
    "IPD2+ DayStart": w(ipd2Base > 0 ? Math.round(ipd2Base) : null, "IPD2+ DayStart"),
    "IPD2+ Clearance": w(ipd2Clearance, "IPD2+ Clearance"),
  };
}

function computeExperience(rows, fids, dateStr, tR, aT) {
  if(!rows.length) return null;
  const n=k=>rows.reduce((s,r)=>s+(Number(r[k])||0),0);
  const pct=(a,b)=>b?Math.round(a/b*1000)/10:null;
  const pm=(a,b)=>b?Math.round(a/b*10000)/100:null; // 2dp
  const ptk=(a,b)=>b?Math.round(a/b*100000)/100:null; // 2dp
  const w=(v,m)=>{ if(v===null) return null; return {actual:v,target:resolveTargetForFids(m,fids,dateStr,tR,aT)}; };
  return {"Fwd TAT Closure":w(pct(n("Fwd_Closure"),n("Fwd_Escalations")),"Fwd TAT Closure"),"Rev TAT Closure":w(pct(n("Rev_Closure"),n("Rev_Escalations")),"Rev TAT Closure"),"Escalation Index":w(pm(n("Escalations"),n("Escalations_Base")),"Escalation Index"),"CXNS":w(ptk(n("CXNS"),n("CXNS_Base")),"CXNS"),"Rev D2 Closure":w(pct(n("D2Pickup"),n("Total_Pickup")),"Rev D2 Closure")};
}

function computeLoss(rows, fids, dateStr, tR, aT) {
  if(!rows.length) return null;
  const n=k=>rows.reduce((s,r)=>s+(Number(r[k])||0),0);
  const pct=(a,b)=>b?Math.round(a/b*1000)/10:null;
  const w=(v,m)=>{ if(v===null) return null; return {actual:v,target:resolveTargetForFids(m,fids,dateStr,tR,aT)}; };
  const wv=(v,m)=>({actual:Number(v),target:resolveTargetForFids(m,fids,dateStr,tR,aT)});
  return {"PRC%":w(pct(n("PRC_Done"),n("PRC_Eligible")),"PRC%"),"Pickup Cancelled Loss":wv(n("Pickup_Loss"),"Pickup Cancelled Loss"),"Logistics Loss":wv(n("Logistics_Loss"),"Logistics Loss"),"Fraud Loss":wv(n("Fraud_Loss"),"Fraud Loss")};
}

function computeEfficiency(rows, fids, dateStr, tR, aT) {
  if(!rows.length) return null;
  const n=k=>rows.reduce((s,r)=>s+(Number(r[k])||0),0);
  const pct=(a,b)=>b?Math.round(a/b*1000)/10:null;
  const rat=(a,b)=>b?Math.round(a/b*100)/100:null; // 2dp for productivity
  const w=(v,m)=>{ if(v===null) return null; return {actual:v,target:resolveTargetForFids(m,fids,dateStr,tR,aT)}; };
  return {"EMO 8AM":w(pct(n("OFD_8"),n("OFD")),"EMO 8AM"),"EMO 10AM":w(pct(n("OFD_10"),n("OFD")),"EMO 10AM"),"Productivity":w(rat(n("Delivered"),n("Unique_WM")),"Productivity"),"Conversion":w(pct(n("Delivered"),n("OFD")),"Conversion"),"OTRS Live":w(pct(n("OTRS_Live"),n("OTRS_Eligible")),"OTRS Live"),"OTRS Adherence":w(pct(n("OTRS_Shipments"),n("Total_Shipments")),"OTRS Adherence")};
}

function computeCost(rows, fids, dateStr, tR, aT) {
  if(!rows.length) return null;
  const n=k=>rows.reduce((s,r)=>s+(Number(r[k])||0),0);
  const rat=(a,b)=>b?Math.round(a/b*100)/100:null;
  const w=(v,m)=>{ if(v===null) return null; return {actual:v,target:resolveTargetForFids(m,fids,dateStr,tR,aT)}; };
  const valid=rows.filter(r=>Number(r["HI_Arrival"])>0);
  const avgArr=valid.length?Math.round(valid.reduce((s,r)=>s+(Number(r["HI_Arrival"])||0),0)/valid.length):null;
  return {"HI Arrival":w(avgArr,"HI Arrival"),"HMT Actual":{actual:Math.round(n("HMT_Actual")),target:resolveTargetForFids("HMT Actual",fids,dateStr,tR,aT)},"Van Productivity":w(rat(n("Van_OFD"),n("Total_Vans")),"Van Productivity")};
}

// For DAILY_AVG_METRICS in multi-day periods:
// Show the latest date's data within the selected range (sum across hubs for that date).
function computeLatestDateMetric(metric, rawRel, rawCost, fids, dr, tR, aT) {
  const srcRaw = metric === "IPD2+ DayStart" ? rawRel : rawCost;
  const srcNc  = metric === "IPD2+ DayStart" ? REL_NUM : COST_NUM;
  const srcFn  = metric === "IPD2+ DayStart" ? computeReliability : computeCost;

  // Find the latest date within range that has data for any hub in fids
  let latestDs = null;
  srcRaw.forEach(r => {
    if (!fids.has(String(r.Facility_ID||"").trim())) return;
    const d = parseDate(r.Date);
    if (!d || d < dr.from || d > dr.to) return;
    const ds2 = d.toISOString().split("T")[0];
    if (!latestDs || ds2 > latestDs) latestDs = ds2;
  });
  if (!latestDs) return null;

  // Compute for all hubs on that latest date
  const f = new Date(latestDs); f.setHours(0,0,0,0);
  const t = new Date(latestDs); t.setHours(23,59,59,999);
  const dd = { from: f, to: t };
  const filtered = filterRows(srcRaw, fids, dd, srcNc);
  if (!filtered.length) return null;
  const res = srcFn(filtered, fids, latestDs, tR, aT);
  return (res && res[metric] && res[metric].actual != null) ? res[metric].actual : null;
}

function getFullMx(nodeId, hier, hiMap, rR, eR, lR, efR, cR, dr, tR, aT) {
  const mx={}; ALL_METRICS.forEach(m=>mx[m]=null); if(!dr) return mx;
  const fids=new Set(getFacilitiesForNode(nodeId,hier,hiMap).map(f=>String(f).trim())); if(!fids.size) return mx;
  const ds=dr.from.toISOString().split("T")[0];

  // Single-day check
  const isSingleDay = dr.from.toISOString().split("T")[0] === dr.to.toISOString().split("T")[0];

  const apply=(fn,raw,nc)=>{ if(!raw.length) return; const f=filterRows(raw,fids,dr,nc); if(!f.length) return; const r=fn(f,fids,ds,tR,aT); if(r) Object.entries(r).forEach(([m,v])=>{ if(v!==null) mx[m]=v; }); };
  apply(computeReliability,rR,REL_NUM); apply(computeExperience,eR,EXP_NUM); apply(computeLoss,lR,LOSS_NUM); apply(computeEfficiency,efR,EFF_NUM); apply(computeCost,cR,COST_NUM);

  // Multi-day: override DAILY_AVG_METRICS with latest-date value
  if (!isSingleDay) {
    DAILY_AVG_METRICS.forEach(metric => {
      const val = computeLatestDateMetric(metric, rR, cR, fids, dr, tR, aT);
      if (val !== null) {
        const target = mx[metric]?.target ?? null;
        mx[metric] = { actual: val, target };
      }
    });
  }

  return mx;
}

function buildTrendData(nodeId, hier, hiMap, rR, eR, lR, efR, cR, dr, tR, aT, metric) {
  const fids=new Set(getFacilitiesForNode(nodeId,hier,hiMap).map(f=>String(f).trim()));
  if(!fids.size) return [];
  const allDates=new Set();
  [...rR,...eR,...lR,...efR,...cR].forEach(r=>{ const d=parseDate(r.Date); if(!d) return; if(d>=dr.from&&d<=dr.to&&fids.has(String(r.Facility_ID||"").trim())) allDates.add(d.toISOString().split("T")[0]); });
  const ds=dr.from.toISOString().split("T")[0];
  return [...allDates].sort().map(ds2=>{
    const f=new Date(ds2); f.setHours(0,0,0,0); const t=new Date(ds2); t.setHours(23,59,59,999); const dd={from:f,to:t};
    const apply=(fn,raw,nc)=>{ const fl=filterRows(raw,fids,dd,nc); return fl.length?fn(fl,fids,ds,tR,aT):null; };
    let val=null,target=null;
    const tryGet=res=>{ if(!res) return; const v=res[metric]; if(v){val=v.actual;target=v.target;} };
    tryGet(apply(computeReliability,rR,REL_NUM)); tryGet(apply(computeExperience,eR,EXP_NUM)); tryGet(apply(computeLoss,lR,LOSS_NUM)); tryGet(apply(computeEfficiency,efR,EFF_NUM)); tryGet(apply(computeCost,cR,COST_NUM));
    if(val===null) return null;
    return {date:ds2,label:new Date(ds2).toLocaleDateString("en-IN",{day:"2-digit",month:"short"}),actual:val,target};
  }).filter(Boolean);
}

// ─── ITEM 3: Comparison colors ────────────────────────────────────────────────
const COMP_COLORS = ["#f59e0b","#10b981","#ef4444","#8b5cf6","#06b6d4","#f97316"];

// ─── SVG Chart with data labels and comparison series ─────────────────────────
function SVGChart({ data, color, chartType, metric, compSeries }) {
  const [hoverIdx, setHoverIdx] = useState(null);
  const containerRef = useRef(null);
  const W=700, H=280, PL=64, PR=20, PT=24, PB=40;
  const IW=W-PL-PR, IH=H-PT-PB;

  const allSeries = [
    {key:"main", data, color, label:"My Data"},
    ...(compSeries||[]).map((s,i)=>({key:"comp"+i, data:s.data, color:COMP_COLORS[i%COMP_COLORS.length], label:s.name}))
  ];

  const allVals = allSeries.flatMap(s=>s.data.flatMap(d=>[d.actual,d.target].filter(v=>v!=null)));
  if(!allVals.length) return null;

  const minV=Math.min(...allVals), maxV=Math.max(...allVals);
  const pad=Math.max((maxV-minV)*0.2, Math.abs(maxV)*0.1, 0.5);
  const yMin=minV-pad, yMax=maxV+pad, yRange=yMax-yMin;

  const n = data.length;
  const toX = i => PL+(n<2 ? IW/2 : (i/(n-1))*IW);
  const toY = v => PT+IH-((v-yMin)/yRange)*IH;
  const barW = Math.max(3, Math.min(20, (IW/Math.max(n,1))*0.4));

  const yTicks = Array.from({length:5},(_,i)=>yMin+(i/4)*yRange);

  const makePath = (pts) => {
    let d=""; let prev=null;
    pts.forEach((pt,i)=>{
      const v=pt.actual; if(v==null){prev=null;return;}
      const x=toX(i), y=toY(v);
      d += prev===null ? `M${x},${y}` : ` L${x},${y}`;
      prev=i;
    });
    return d;
  };

  const handleMouseMove = e => {
    const el=containerRef.current; if(!el) return;
    const rect=el.getBoundingClientRect();
    const rx=(e.clientX-rect.left)/rect.width;
    const idx=Math.round(rx*(n-1));
    setHoverIdx(idx>=0&&idx<n?idx:null);
  };

  const hx = hoverIdx!=null ? toX(hoverIdx) : null;
  const showLabel = i => { const step=Math.max(1,Math.ceil(n/10)); return i%step===0||i===n-1; };

  return (
    <div ref={containerRef} style={{position:"relative",width:"100%",cursor:"crosshair"}} onMouseMove={handleMouseMove} onMouseLeave={()=>setHoverIdx(null)}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block",overflow:"visible"}}>
        {/* Grid + Y labels */}
        {yTicks.map((t,i)=>(
          <g key={i}>
            <line x1={PL} y1={toY(t)} x2={W-PR} y2={toY(t)} stroke="#f0f0f0" strokeWidth="1"/>
            <text x={PL-5} y={toY(t)+4} textAnchor="end" fontSize="10" fill="#aaa">{fmtChart(t,metric)}</text>
          </g>
        ))}
        {/* X labels */}
        {data.map((pt,i)=>showLabel(i)&&(
          <text key={i} x={toX(i)} y={H-6} textAnchor="middle" fontSize="10" fill="#aaa">{pt.label}</text>
        ))}
        {/* Hover line */}
        {hoverIdx!=null && <line x1={hx} y1={PT} x2={hx} y2={PT+IH} stroke="#e5e7eb" strokeWidth="1" strokeDasharray="4,2"/>}

        {chartType==="bar" ? (
          // Bar chart - main series only, target as grey bg
          data.map((pt,i)=>{
            if(pt.actual==null) return null;
            const x=toX(i), y=toY(pt.actual), bh=Math.max(2,(PT+IH)-y);
            const isHovered = hoverIdx===i;
            return (
              <g key={i}>
                {pt.target!=null && (() => { const ty=toY(pt.target); const tbh=Math.max(2,(PT+IH)-ty); return <rect x={x-barW/2-1} y={ty} width={barW+2} height={tbh} fill="#e5e7eb" rx="2" opacity="0.8"/>; })()}
                <rect x={x-barW/2} y={y} width={barW} height={bh} fill={color} rx="2" opacity={isHovered?1:0.82}/>
                {/* Data label on bar */}
                {showLabel(i)&&<text x={x} y={y-4} textAnchor="middle" fontSize="9" fill={color} fontWeight="600">{fmtChart(pt.actual,metric)}</text>}
              </g>
            );
          })
        ) : (
          // Line chart - all series
          <>
            <defs>
              {allSeries.map(s=>(
                <linearGradient key={s.key} id={`g_${s.key}`} x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor={s.color} stopOpacity="0.15"/>
                  <stop offset="100%" stopColor={s.color} stopOpacity="0.01"/>
                </linearGradient>
              ))}
            </defs>
            {/* Target line for main */}
            {(() => { const tp=makePath(data.filter((_,i)=>data[i].target!=null).length?data.map(d=>({actual:d.target})):[]); return tp?<path d={tp} fill="none" stroke="#bbb" strokeWidth="1.4" strokeDasharray="5,3"/>:null; })()}
            {/* Area + line for each series */}
            {allSeries.map((s,si)=>{
              const lp=makePath(s.data);
              if(!lp) return null;
              return (
                <g key={s.key}>
                  {si===0&&<path d={lp+` L${toX(s.data.length-1)},${PT+IH} L${toX(0)},${PT+IH} Z`} fill={`url(#g_${s.key})`}/>}
                  <path d={lp} fill="none" stroke={s.color} strokeWidth={si===0?2.2:1.8} strokeLinecap="round" strokeLinejoin="round" strokeDasharray={si>0?"6,3":"none"}/>
                  {/* Dots + data labels */}
                  {s.data.map((pt,i)=>pt.actual!=null&&(
                    <g key={i}>
                      <circle cx={toX(i)} cy={toY(pt.actual)} r={hoverIdx===i?5:2.5} fill={s.color} stroke="#fff" strokeWidth={hoverIdx===i?1.5:0}/>
                      {showLabel(i)&&<text x={toX(i)} y={toY(pt.actual)-8} textAnchor="middle" fontSize="9" fill={s.color} fontWeight="600">{fmtChart(pt.actual,metric)}</text>}
                    </g>
                  ))}
                </g>
              );
            })}
          </>
        )}
      </svg>

      {/* Tooltip */}
      {hoverIdx!=null && (
        <div style={{position:"absolute",pointerEvents:"none",zIndex:20,left:Math.min((hoverIdx/(n-1||1))*100+2,65)+"%",top:"8%",background:"#fff",border:"1px solid #e5e7eb",borderRadius:8,padding:"8px 12px",boxShadow:"0 4px 16px rgba(0,0,0,.12)",minWidth:140}}>
          <div style={{fontSize:11,fontWeight:700,color:"#374151",marginBottom:6}}>{data[hoverIdx]?.label}</div>
          {allSeries.map(s=>{
            const pt=s.data[hoverIdx]; if(!pt||pt.actual==null) return null;
            return (
              <div key={s.key} style={{display:"flex",alignItems:"center",gap:6,fontSize:11,marginBottom:3}}>
                <span style={{width:8,height:8,borderRadius:"50%",background:s.color,display:"inline-block",flexShrink:0}}/>
                <span style={{color:"#6b7280",flex:1}}>{s.label}</span>
                <span style={{fontWeight:700,color:s.color}}>{fmtChart(pt.actual,metric)}</span>
              </div>
            );
          })}
          {data[hoverIdx]?.target!=null&&(
            <div style={{display:"flex",alignItems:"center",gap:6,fontSize:11,marginTop:3,paddingTop:3,borderTop:"1px solid #f3f4f6"}}>
              <span style={{width:8,height:2,background:"#bbb",display:"inline-block",flexShrink:0}}/>
              <span style={{color:"#9ca3af",flex:1}}>Target</span>
              <span style={{fontWeight:600,color:"#9ca3af"}}>{fmtChart(data[hoverIdx].target,metric)}</span>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function PaginatedTable({rows,cols,colorFn,extraCols,pageSize=10}) {

  const PS=pageSize, total=rows.length, pages=Math.max(1,Math.ceil(total/PS));

    <div>
      <div style={{overflowX:"auto"}}>

          </tr></thead>

              ? <tr><td colSpan={cols.length+(extraCols?.length||0)} style={{padding:28,textAlign:"center",color:"#9ca3af",fontSize:12}}>No records.</td></tr>
              : slice.map((r,i)=>(
                  <tr key={i} style={{borderBottom:"1px solid #f3f4f6",background:r._bg||"transparent"}} onMouseEnter={e=>e.currentTarget.style.background=r._hoverBg||"#fafafa"} onMouseLeave={e=>e.currentTarget.style.background=r._bg||"transparent"}>
                    {extraCols&&extraCols.map((ec,j)=><td key={j} style={{padding:"9px 12px",whiteSpace:"nowrap"}}>{ec.render(r)}</td>)}
                    {cols.map(col=><td key={col} style={{padding:"9px 12px",fontSize:12,...(colorFn?colorFn(col,r):{color:"#111827"})}}>{r[col]||"—"}</td>)}
                  </tr>
                ))
            }
          </tbody>
        </table>
      </div>
      {pages>1&&(
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 12px",borderTop:"1px solid #f3f4f6",background:"#fafafa"}}>
          <span style={{fontSize:11,color:"#6b7280"}}>Showing {total===0?0:(page-1)*PS+1}–{Math.min(page*PS,total)} of {total}</span>
          <div style={{display:"flex",gap:3}}>

            <PageNavBtn label="‹" onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1}/>
            {Array.from({length:Math.min(5,pages)},(_,i)=>{ let p=pages<=5?i+1:page<=3?i+1:page>=pages-2?pages-4+i:page-2+i; return <button key={p} onClick={()=>setPage(p)} style={{padding:"3px 8px",border:"1px solid #e5e7eb",borderRadius:5,background:page===p?"#2563eb":"#fff",color:page===p?"#fff":"#374151",cursor:"pointer",fontSize:11,fontWeight:page===p?700:400}}>{p}</button>; })}

            <PageNavBtn label="»" onClick={()=>setPage(pages)} disabled={page===pages}/>
          </div>
        </div>
      )}
    </div>
  );
}

function DrillTable({group,hier,hiMap,rR,eR,lR,efR,cR,dr,trail,onDrill,onCrumb,onClose,tR,aT}) {
  const [pg,setPg]=useState(1); const DPPS=20;
  const cid=trail[trail.length-1].id;
  const kids=(hier[cid]?.children||[]).filter(id=>hier[id]);
  const getMx=id=>getFullMx(id,hier,hiMap,rR,eR,lR,efR,cR,dr,tR,aT);
  const tp=Math.max(1,Math.ceil(kids.length/DPPS));
  const pgKids=kids.slice((pg-1)*DPPS,pg*DPPS);
  return (
    <div style={{border:"1px solid "+group.border,borderTop:"none",borderRadius:"0 0 10px 10px",background:"#fff",overflow:"hidden"}}>
      <div style={{background:group.color+"15",borderBottom:"1px solid "+group.border,padding:"6px 12px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:5,fontSize:11,flexWrap:"wrap"}}>

          {trail.map((t,i)=>(

              {i>0&&<span style={{color:"#d1d5db"}}>›</span>}
              <button onClick={()=>{onCrumb(i);setPg(1);}} style={{padding:"2px 8px",borderRadius:5,fontSize:11,fontWeight:600,border:"none",cursor:i<trail.length-1?"pointer":"default",background:i===trail.length-1?group.color:"#e5e7eb",color:i===trail.length-1?"#fff":"#374151"}}>{t.label}</button>
            </span>
          ))}
        </div>
        <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:15,color:"#9ca3af",lineHeight:1}}>✕</button>
      </div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead><tr style={{background:"#f9fafb"}}>
            {["Name","Role",...group.metrics,"Score"].map((h,i)=>(
              <th key={i} style={{padding:"7px 10px",textAlign:i>1?"center":"left",fontSize:10,fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:".04em",whiteSpace:"nowrap",borderBottom:"1px solid "+group.border}}>{h}</th>
            ))}
          </tr></thead>
          <tbody>
            {pgKids.map(id=>{
              const n=hier[id]; const mx=getMx(id);
              const scoreable=group.metrics.filter(m=>mx[m]&&mx[m].target!=null);
              const goodCnt=scoreable.filter(m=>isGood(m,mx[m].actual,mx[m].target)).length;
              const pct=scoreable.length?Math.round(goodCnt/scoreable.length*100):null;
              const sc=pct===null?"#9ca3af":pct===100?"#16a34a":pct>=60?"#d97706":"#dc2626";
              const canDrill=(n.children||[]).length>0;
              return (
                <tr key={id} style={{borderBottom:"1px solid "+group.border,cursor:canDrill?"pointer":"default"}} onClick={()=>canDrill&&(onDrill(id,n.name),setPg(1))} onMouseEnter={e=>{if(canDrill)e.currentTarget.style.background=group.bg;}} onMouseLeave={e=>{e.currentTarget.style.background="transparent";}}>
                  <td style={{padding:"7px 10px",fontWeight:700,color:"#111827",fontSize:12}}>

  );
}

function MyPerformance({userId,hier,hiMap,rR,eR,lR,efR,cR,dr,tR,aT}) {
  const node=hier[userId]; const hasKids=(node.children||[]).length>0;
  const [drills,setDrills]=useState({});
  const mx=getFullMx(userId,hier,hiMap,rR,eR,lR,efR,cR,dr,tR,aT);

  const drill=(gl,id,nm)=>setDrills(p=>({...p,[gl]:[...p[gl],{id,label:nm}]}));
  const crumb=(gl,i)=>setDrills(p=>({...p,[gl]:p[gl].slice(0,i+1)}));
  const close=gl=>setDrills(p=>{const n={...p};delete n[gl];return n;});
  return (
    <div style={{background:"#fff",borderRadius:14,border:"1px solid #e5e7eb",boxShadow:"0 1px 4px rgba(0,0,0,.06)",padding:20,marginBottom:24}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:18}}>

        {hasKids&&<span style={{marginLeft:"auto",fontSize:11,color:"#9ca3af"}}>Click category to compare span ↓</span>}
      </div>
      {METRIC_GROUPS.map(g=>{
        const isOpen=!!drills[g.label];
        return (
          <div key={g.label} style={{marginBottom:isOpen?14:8}}>
            <div style={{borderRadius:isOpen?"10px 10px 0 0":10,border:"1px solid "+g.border,background:g.bg,overflow:"hidden"}}>
              <div onClick={()=>toggle(g)} style={{background:g.color,color:"#fff",padding:"6px 12px",cursor:hasKids?"pointer":"default",display:"flex",justifyContent:"space-between",alignItems:"center"}} onMouseEnter={e=>{if(hasKids)e.currentTarget.style.opacity=".88";}} onMouseLeave={e=>{e.currentTarget.style.opacity="1";}}>
                <span style={{fontSize:10,fontWeight:700,letterSpacing:".06em",textTransform:"uppercase"}}>{g.label}</span>
                {hasKids&&<span style={{fontSize:10,opacity:.9}}>{isOpen?"▲ collapse":"↓ expand span"}</span>}
              </div>
              <MetricCells g={g} mx={mx}/><DNAFootnote g={g} mx={mx}/>
            </div>
            {isOpen&&<DrillTable group={g} hier={hier} hiMap={hiMap} rR={rR} eR={eR} lR={lR} efR={efR} cR={cR} dr={dr} trail={drills[g.label]} onDrill={(id,nm)=>drill(g.label,id,nm)} onCrumb={i=>crumb(g.label,i)} onClose={()=>close(g.label)} tR={tR} aT={aT}/>}
          </div>
        );
      })}
    </div>
  );
}

// HubSearchBox: type-to-filter searchable combobox for hub names

        />
        <span style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",fontSize:10,color:"#9ca3af",pointerEvents:"none"}}>🔍</span>
      </div>

        <div style={{position:"absolute",top:"100%",left:0,zIndex:200,background:"#fff",border:"1px solid #dbeafe",borderRadius:8,boxShadow:"0 4px 16px rgba(0,0,0,.12)",minWidth:200,maxHeight:220,overflowY:"auto",marginTop:2}}>
          {filtered.map((h,i)=>(

              style={{padding:"7px 12px",fontSize:12,color:"#374151",cursor:"pointer",borderBottom:"1px solid #f3f4f6",lineHeight:1.4}}
              onMouseEnter={e=>e.currentTarget.style.background="#eff6ff"}

              <div style={{fontWeight:600}}>{h.hubName}</div>
              <div style={{fontSize:10,color:"#9ca3af"}}>{h.hiName}</div>
            </div>
          ))}

            <div style={{padding:"5px 12px",fontSize:10,color:"#9ca3af",textAlign:"center",borderTop:"1px solid #f3f4f6"}}>Type more to narrow results…</div>
          )}
        </div>
      )}
    </div>
  );
}

function HierarchyCompareFilter({ userId, hier, hiMap, onCompare }) {
  const isLeaf = (hier[userId]?.children||[]).length === 0;
  if (isLeaf) return null;

  // managerLevels: [{title, nodes:[{id,name,title,label}]}] — one entry per unique designation
  const managerLevels = useMemo(() => getNonLeafDescendantLevels(userId, hier), [userId, hier]);
  const allHubs = useMemo(() => getLeafHubsUnder(userId, hier, hiMap), [userId, hier, hiMap]);

  // selections keyed by title string (not levelIdx) to avoid depth-mismatch issues
  const [mgrSels, setMgrSels] = useState({}); // { title -> nodeId }
  const [hubSel, setHubSel] = useState(null);

  const handleMgrSelect = (title, nodeId) => {
    setMgrSels(prev => {
      const next = { ...prev };
      if (!nodeId) { delete next[title]; }
      else { next[title] = nodeId; }
      // Clear all subsequent title selections when a parent changes
      const titleIdx = managerLevels.findIndex(l=>l.title===title);
      managerLevels.slice(titleIdx+1).forEach(l => delete next[l.title]);
      return next;
    });
    setHubSel(null);
  };

  // For each title level, show all nodes of that title that are children of the
  // selected node at the previous title level (or all if no prior selection).
  const getOptsForTitle = (title, ti) => {
    if (ti === 0) return managerLevels[0]?.nodes || [];
    // Find which node was selected at the previous title level
    const prevTitle = managerLevels[ti-1]?.title;
    const prevSel = prevTitle ? mgrSels[prevTitle] : null;
    if (!prevSel) {
      // No parent selected — show all nodes of this title
      return managerLevels[ti]?.nodes || [];
    }
    // Show only children of the selected parent that have this title
    const parent = hier[prevSel];
    if (!parent) return [];
    return (parent.children||[])
      .filter(id => hier[id] && (hier[id].children||[]).filter(c=>hier[c]).length > 0 && hier[id].title === title)
      .map(id => ({id, name:hier[id].name, title:hier[id].title, label:hier[id].label}));
  };

  // Filter hubs by the deepest active manager selection
  const filteredHubs = useMemo(() => {
    const activeSels = managerLevels.map(l=>mgrSels[l.title]).filter(Boolean);
    if (!activeSels.length) return allHubs;
    const deepestNodeId = activeSels[activeSels.length-1];
    return getLeafHubsUnder(deepestNodeId, hier, hiMap);
  }, [mgrSels, allHubs, hier, hiMap, managerLevels]);

  const handleAdd = () => {
    if (!hubSel) return;
    onCompare(hubSel.nodeId, hubSel.hubName);
    setHubSel(null);
  };

  return (
    <div style={{background:"#f8faff",border:"1px solid #dbeafe",borderRadius:10,padding:"12px 14px"}}>
      <div style={{fontSize:10,fontWeight:700,color:"#2563eb",textTransform:"uppercase",letterSpacing:".05em",marginBottom:10}}>📊 Compare with Span</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,alignItems:"flex-end"}}>
        {managerLevels.map((lvl, ti) => {
          const opts = getOptsForTitle(lvl.title, ti);
          if (!opts.length) return null;
          return (
            <div key={lvl.title} style={{display:"flex",flexDirection:"column",gap:3}}>
              <div style={{fontSize:9,fontWeight:600,color:"#6b7280",textTransform:"uppercase",letterSpacing:".04em"}}>{lvl.title}</div>
              <select value={mgrSels[lvl.title]||""} onChange={e=>handleMgrSelect(lvl.title,e.target.value)}
                style={{border:"1px solid #dbeafe",borderRadius:6,padding:"4px 8px",fontSize:11,color:"#374151",background:"#fff",outline:"none",cursor:"pointer",minWidth:130}}>
                <option value="">— All —</option>
                {opts.map(o=><option key={o.id} value={o.id}>{o.name}</option>)}
              </select>
            </div>
          );
        })}
        <HubSearchBox allHubs={filteredHubs} onSelect={h=>setHubSel(h)}/>
        <button onClick={handleAdd} disabled={!hubSel}
          style={{padding:"5px 14px",background:hubSel?"#2563eb":"#e5e7eb",color:hubSel?"#fff":"#9ca3af",border:"none",borderRadius:6,fontSize:11,fontWeight:600,cursor:hubSel?"pointer":"default",height:30,alignSelf:"flex-end"}}>
          + Add
        </button>
      </div>
    </div>
  );
}

// ─── Trends View ──────────────────────────────────────────────────────────────
function TrendsView({userId,hier,hiMap,rR,eR,lR,efR,cR,dr,tR,aT}) {
  const [selGroup,setSelGroup]=useState(METRIC_GROUPS[0].label);
  const [selMetric,setSelMetric]=useState(METRIC_GROUPS[0].metrics[0]);
  const [chartType,setChartType]=useState("line");
  // ITEM 3: comparison nodes
  const [compNodes, setCompNodes] = useState([]); // [{nodeId, name}]
  const group=METRIC_GROUPS.find(g=>g.label===selGroup)||METRIC_GROUPS[0];
  const isLeaf = (hier[userId]?.children||[]).length === 0;

  const trendData=useMemo(()=>buildTrendData(userId,hier,hiMap,rR,eR,lR,efR,cR,dr,tR,aT,selMetric),[userId,selMetric,rR,eR,lR,efR,cR,dr,tR,aT]);
  const compSeries = useMemo(()=>compNodes.map(cn=>({
    nodeId: cn.nodeId,
    name: cn.name,
    data: buildTrendData(cn.nodeId,hier,hiMap,rR,eR,lR,efR,cR,dr,tR,aT,selMetric)
  })),[compNodes,selMetric,rR,eR,lR,efR,cR,dr,tR,aT]);

  const isLower=LOWER_BETTER.has(selMetric);
  const noData=!rR.length&&!eR.length&&!lR.length&&!efR.length&&!cR.length;

  const handleAddComp = (nodeId, name) => {
    if (compNodes.find(c=>c.nodeId===nodeId)) return;
    if (compNodes.length >= 6) return;
    setCompNodes(prev=>[...prev,{nodeId,name}]);
  };
  const handleRemoveComp = (nodeId) => setCompNodes(prev=>prev.filter(c=>c.nodeId!==nodeId));
  const handleClear = () => setCompNodes([]);

  if(noData) return (
    <div style={{background:"#fff",borderRadius:14,border:"1px solid #e5e7eb",padding:60,textAlign:"center",color:"#9ca3af"}}>
      <div style={{fontSize:36,marginBottom:10}}>📈</div>
      <p style={{fontSize:13,fontWeight:600,color:"#374151",marginBottom:4}}>No data uploaded yet</p>
      <p style={{fontSize:12}}>Upload a metrics file to view trend charts.</p>
    </div>
  );

  const actuals=trendData.map(d=>d.actual).filter(v=>v!=null);
  const mn=actuals.length?Math.min(...actuals):null, mx2=actuals.length?Math.max(...actuals):null;
  const avg=actuals.length?Math.round(actuals.reduce((a,b)=>a+b,0)/actuals.length*100)/100:null;
  const latest=trendData.length?trendData[trendData.length-1]:null;
  const latestGood=latest&&latest.target!=null?isGood(selMetric,latest.actual,latest.target):null;

  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {/* Controls */}
      <div style={{background:"#fff",borderRadius:14,border:"1px solid #e5e7eb",padding:"14px 18px",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
        <div style={{display:"flex",alignItems:"flex-start",gap:16,flexWrap:"wrap",marginBottom:!isLeaf?14:0}}>
          <div>
            <div style={{fontSize:10,fontWeight:600,color:"#6b7280",textTransform:"uppercase",letterSpacing:".05em",marginBottom:5}}>Category</div>
            <div style={{display:"flex",background:"#f3f4f6",borderRadius:8,padding:2,gap:2,flexWrap:"wrap"}}>
              {METRIC_GROUPS.map(g=>(<button key={g.label} onClick={()=>{setSelGroup(g.label);setSelMetric(g.metrics[0]);}} style={{padding:"4px 10px",borderRadius:6,border:"none",cursor:"pointer",fontSize:11,fontWeight:500,background:selGroup===g.label?g.color:"transparent",color:selGroup===g.label?"#fff":"#6b7280"}}>{g.label}</button>))}
            </div>
          </div>
          <div>
            <div style={{fontSize:10,fontWeight:600,color:"#6b7280",textTransform:"uppercase",letterSpacing:".05em",marginBottom:5}}>Metric</div>
            <div style={{display:"flex",background:"#f3f4f6",borderRadius:8,padding:2,gap:2,flexWrap:"wrap"}}>
              {group.metrics.map(m=>(<button key={m} onClick={()=>setSelMetric(m)} style={{padding:"4px 8px",borderRadius:6,border:"none",cursor:"pointer",fontSize:10,fontWeight:500,background:selMetric===m?group.color:"transparent",color:selMetric===m?"#fff":"#6b7280"}}>{m}</button>))}
            </div>
          </div>
          <div style={{marginLeft:"auto"}}>
            <div style={{fontSize:10,fontWeight:600,color:"#6b7280",textTransform:"uppercase",letterSpacing:".05em",marginBottom:5}}>Chart</div>
            <div style={{display:"flex",background:"#f3f4f6",borderRadius:8,padding:2,gap:2}}>
              {[{k:"line",l:"📈 Line"},{k:"bar",l:"📊 Bar"}].map(({k,l})=>(<button key={k} onClick={()=>setChartType(k)} style={{padding:"4px 10px",borderRadius:6,border:"none",cursor:"pointer",fontSize:11,fontWeight:500,background:chartType===k?"#fff":"transparent",color:chartType===k?"#2563eb":"#6b7280",boxShadow:chartType===k?"0 1px 3px rgba(0,0,0,.1)":"none"}}>{l}</button>))}
            </div>
          </div>
        </div>
        {/* ITEM 3: Comparison filter */}
        {!isLeaf && (
          <div>
            <HierarchyCompareFilter userId={userId} hier={hier} hiMap={hiMap} onCompare={handleAddComp}/>
            {compNodes.length > 0 && (
              <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:10,alignItems:"center"}}>
                <span style={{fontSize:10,color:"#6b7280",fontWeight:600}}>Comparing:</span>
                {compNodes.map((cn,i)=>(
                  <span key={cn.nodeId} style={{display:"flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:99,fontSize:11,fontWeight:600,background:COMP_COLORS[i%COMP_COLORS.length]+"22",color:COMP_COLORS[i%COMP_COLORS.length],border:"1px solid "+COMP_COLORS[i%COMP_COLORS.length]+"44"}}>
                    <span style={{width:6,height:6,borderRadius:"50%",background:COMP_COLORS[i%COMP_COLORS.length],display:"inline-block"}}/>
                    {cn.name}
                    <button onClick={()=>handleRemoveComp(cn.nodeId)} style={{background:"none",border:"none",cursor:"pointer",fontSize:11,color:COMP_COLORS[i%COMP_COLORS.length],padding:0,lineHeight:1}}>✕</button>
                  </span>
                ))}
                <button onClick={handleClear} style={{padding:"2px 10px",borderRadius:99,fontSize:11,border:"1px solid #e5e7eb",background:"#f9fafb",color:"#6b7280",cursor:"pointer"}}>Clear All</button>
              </div>
            )}
          </div>
        )}
      </div>

      {/* Chart card */}
      <div style={{background:"#fff",borderRadius:14,border:"1px solid #e5e7eb",padding:"18px 20px",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:8}}>
          <div>
            <h3 style={{fontSize:14,fontWeight:700,color:"#111827",margin:0}}>{selMetric}</h3>
            <p style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{trendData.length} data points in period</p>
          </div>
          <div style={{display:"flex",gap:12,flexWrap:"wrap",fontSize:11,alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:12,height:3,background:group.color,borderRadius:2,display:"inline-block"}}/><span style={{color:"#6b7280"}}>My Data</span></div>
            {compSeries.map((s,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:4}}>
                <span style={{width:12,height:2,background:COMP_COLORS[i%COMP_COLORS.length],display:"inline-block",borderRadius:2}}/>
                <span style={{color:"#6b7280"}}>{s.name}</span>
              </div>
            ))}
            {trendData.some(d=>d.target!=null)&&<div style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:12,height:2,background:"#bbb",display:"inline-block"}}/><span style={{color:"#6b7280"}}>Target</span></div>}
          </div>
        </div>
        {trendData.length===0
          ? <div style={{padding:50,textAlign:"center",color:"#9ca3af"}}><div style={{fontSize:28,marginBottom:8}}>📭</div><p style={{fontSize:12}}>No data for <strong style={{color:"#374151"}}>{selMetric}</strong> in this period.</p></div>
          : <SVGChart data={trendData} color={group.color} chartType={chartType} metric={selMetric} compSeries={compSeries}/>
        }
      </div>

      {/* Stats */}
      {actuals.length>0&&(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:10}}>
          {[
            ["Latest",latest?fmt(latest.actual,selMetric):"—",latestGood===null?"#374151":latestGood?"#16a34a":"#dc2626"],
            ["Average",avg!=null?fmt(avg,selMetric):"—","#374151"],
            ["Best",isLower?(mn!=null?fmt(mn,selMetric):"—"):(mx2!=null?fmt(mx2,selMetric):"—"),"#16a34a"],
            ["Worst",isLower?(mx2!=null?fmt(mx2,selMetric):"—"):(mn!=null?fmt(mn,selMetric):"—"),"#dc2626"],
          ].map(([label,val,col])=>(
            <div key={label} style={{background:"#f9fafb",borderRadius:10,border:"1px solid #e5e7eb",padding:"12px 14px",textAlign:"center"}}>

              <div style={{fontSize:17,fontWeight:700,color:col}}>{val}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

    <main style={{maxWidth:1200,margin:"0 auto",padding:20}}>
      {/* Period bar */}
      <div style={{background:"#fff",borderRadius:14,border:"1px solid #e5e7eb",boxShadow:"0 1px 4px rgba(0,0,0,.06)",padding:"14px 18px",marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
          <Avatar name={node.name} size={38}/>
          <div><div style={{fontWeight:700,fontSize:14,color:"#111827"}}>{node.name}</div><div style={{fontSize:11,color:"#9ca3af"}}>{node.title} · {node.label}</div></div>
        </div>
        <div style={{display:"flex",alignItems:"center",flexWrap:"wrap",gap:8}}>
          <div style={{display:"flex",background:"#f3f4f6",borderRadius:8,padding:2,gap:2}}>
            {PERIODS.map(p=><button key={p} onClick={()=>{setPeriod(p);setShowCustom(p==="Custom");}} style={{padding:"4px 11px",borderRadius:6,border:"none",cursor:"pointer",fontSize:11,fontWeight:500,background:period===p?"#fff":"transparent",color:period===p?"#2563eb":"#6b7280",boxShadow:period===p?"0 1px 3px rgba(0,0,0,.1)":"none"}}>{p}</button>)}
          </div>
          <span style={{fontSize:10,color:"#6b7280",fontStyle:"italic"}}>{getDateLabel()}</span>

          {/* ITEM 2: Week selector dropdown */}
          {period==="Weekly"&&(
            <div style={{display:"flex",alignItems:"center",gap:5,background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:8,padding:"4px 8px"}}>
              <select value={weekSel?`${weekSel.weekNum}`:""}
                onChange={e=>{
                  const wn=parseInt(e.target.value);
                  const found=yearWeeks.find(w=>w.weekNum===wn);
                  if(found) setWeekSel(found);
                }}
                style={{border:"none",background:"transparent",fontSize:11,color:"#374151",outline:"none",cursor:"pointer"}}>
                {yearWeeks.length===0&&<option value="">No completed weeks yet</option>}
                {yearWeeks.map(w=>(
                  <option key={w.weekNum} value={w.weekNum}>
                    {`W${w.weekNum}: ${fmtDate(w.start)} – ${fmtDate(w.end)}`}
                  </option>
                ))}
              </select>
            </div>
          )}

          {showCustom&&(
            <div style={{display:"flex",alignItems:"center",gap:5,background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:8,padding:"4px 8px"}}>
              <input type="date" value={customRange.from} max={customRange.to||undefined} onChange={e=>setCustomRange(p=>({...p,from:e.target.value}))} style={{border:"1px solid #e5e7eb",borderRadius:5,padding:"2px 6px",fontSize:11,outline:"none"}}/>
              <span style={{fontSize:11,color:"#9ca3af"}}>to</span>
              <input type="date" value={customRange.to} min={customRange.from||undefined} max={new Date().toISOString().split("T")[0]} onChange={e=>setCustomRange(p=>({...p,to:e.target.value}))} style={{border:"1px solid #e5e7eb",borderRadius:5,padding:"2px 6px",fontSize:11,outline:"none"}}/>
            </div>
          )}
        </div>
      </div>

      {/* Sub-tab toggle */}
      <div style={{display:"flex",gap:2,marginBottom:14,background:"#f3f4f6",borderRadius:8,padding:2,width:"fit-content"}}>
        {[{k:"performance",l:"📊 My Performance"},{k:"trend",l:"📈 Trends"}].map(({k,l})=>(
          <button key={k} onClick={()=>setTab(k)} style={{padding:"5px 16px",borderRadius:6,border:"none",cursor:"pointer",fontSize:12,fontWeight:500,background:tab===k?"#fff":"transparent",color:tab===k?"#2563eb":"#6b7280",boxShadow:tab===k?"0 1px 3px rgba(0,0,0,.1)":"none"}}>{l}</button>
        ))}
      </div>
      {tab==="performance"&&<MyPerformance userId={userId} hier={hier} hiMap={hiMap} rR={rR} eR={eR} lR={lR} efR={efR} cR={cR} dr={dr} tR={tR} aT={aT}/>}
      {tab==="trend"&&<TrendsView userId={userId} hier={hier} hiMap={hiMap} rR={rR} eR={eR} lR={lR} efR={efR} cR={cR} dr={dr} tR={tR} aT={aT}/>}
    </main>
  );
}

// ─── Admin page ───────────────────────────────────────────────────────────────
function AdminPage({hier,userRows,mappingRows,cloneRows,onOrgUpload,rR,onRR,eR,onER,lR,onLR,efR,onEfR,cR,onCR,tR,onTR,aT,setAT}) {
  const xlsxReady=useXLSX();
  const [tab,setTab]=useState("data"); const [dSub,setDSub]=useState("employees");
  const [msg,setMsg]=useState(""); const [val,setVal]=useState(null);
  const [editAT,setEditAT]=useState(()=>{const o={};ALL_METRICS.forEach(m=>o[m]="");return o;});
  const [atSaved,setAtSaved]=useState(false);
  const flash=m=>{setMsg(m);setTimeout(()=>setMsg(""),4000);};
  const B=(bg="#2563eb",fg="#fff")=>({padding:"5px 12px",background:bg,color:fg,border:"none",borderRadius:5,fontSize:11,fontWeight:600,cursor:"pointer"});

  const handleOrgUpload=e=>{
    if(!xlsxReady){flash("❌ SheetJS still loading, please wait.");return;}
    const file=e.target.files[0];if(!file)return;const inp=e.target;const rd=new FileReader();
    rd.onload=ev=>{try{
      const wb=window.XLSX.read(ev.target.result,{type:"array"});
      const miss=["Employees","HI_Hub_Mapping","Access_Cloning"].filter(s=>!wb.SheetNames.includes(s));
      if(miss.length){flash("❌ Missing sheets: "+miss.join(", "));return;}
      const uR=parseSheet(wb,"Employees",USER_COLS).filter(r=>r.Emp_Name);
      const mR=parseSheet(wb,"HI_Hub_Mapping",MAPPING_COLS).filter(r=>r.HI_Email);
      const cR2=parseSheet(wb,"Access_Cloning",CLONE_COLS).filter(r=>r.Emp_Email&&r.Clone_Email);
      const allE=new Set(uR.map(r=>r.Emp_Email.toLowerCase().trim()));
      const mgrE=new Set(uR.map(r=>r.Manager_Email.toLowerCase().trim()));
      const hiE=new Set(uR.filter(r=>!mgrE.has(r.Emp_Email.toLowerCase().trim())).map(r=>r.Emp_Email.toLowerCase().trim()));
      const pass=mR.filter(r=>{const e=(r.HI_Email||"").toLowerCase().trim();return allE.has(e)&&hiE.has(e);});
      const fail=mR.filter(r=>{const e=(r.HI_Email||"").toLowerCase().trim();return !allE.has(e)||!hiE.has(e);});
      setVal({uR,mR,pass,fail,allE,hiE,cR:cR2});
      onOrgUpload(uR,pass,cR2);
      flash("✅ "+uR.length+" employees, "+pass.length+" valid mappings, "+cR2.length+" clones");
    }catch{flash("❌ Failed to parse file.");}finally{inp.value="";}};
    rd.readAsArrayBuffer(file);
  };

  const handleMetricsUpload=e=>{
    if(!xlsxReady){flash("❌ SheetJS still loading, please wait.");return;}
    const file=e.target.files[0];if(!file)return;const inp=e.target;const rd=new FileReader();
    rd.onload=ev=>{try{
      const wb=window.XLSX.read(ev.target.result,{type:"array"});
      const miss=["Reliability","Experience","Loss","Efficiency","Cost"].filter(s=>!wb.SheetNames.includes(s));
      if(miss.length){flash("❌ Missing sheets: "+miss.join(", "));return;}
      const rRows=parseSheet(wb,"Reliability",RELIABILITY_COLS).filter(r=>r.Facility_ID);
      const eRows=parseSheet(wb,"Experience",EXPERIENCE_COLS).filter(r=>r.Facility_ID);
      const lRows=parseSheet(wb,"Loss",LOSS_COLS).filter(r=>r.Facility_ID);
      const efRows=parseSheet(wb,"Efficiency",EFFICIENCY_COLS).filter(r=>r.Facility_ID);
      const cRows=parseSheet(wb,"Cost",COST_COLS).filter(r=>r.Facility_ID);
      onRR(rRows);onER(eRows);onLR(lRows);onEfR(efRows);onCR(cRows);
      let msg="✅ "+rRows.length+" Rel, "+eRows.length+" Exp, "+lRows.length+" Loss, "+efRows.length+" Eff, "+cRows.length+" Cost rows.";
      if(wb.SheetNames.includes("Targets")){const tRows=parseSheet(wb,"Targets",TARGET_COLS).filter(r=>r.Facility_ID&&r.Metric_Name);onTR(tRows);msg+=" "+tRows.length+" target rows.";}
      flash(msg);
    }catch{flash("❌ Failed to parse file.");}finally{inp.value="";}};
    rd.readAsArrayBuffer(file);
  };

  const saveAT=()=>{const p={};Object.entries(editAT).forEach(([m,v])=>{const n=parseFloat(v);if(!isNaN(n))p[m]=n;});setAT(p);setAtSaved(true);setTimeout(()=>setAtSaved(false),3000);};
  const mainTabs=[{k:"data",l:"📂 Org Upload"},{k:"metrics",l:"📊 Metrics Upload"},{k:"targets",l:"🎯 Targets"},{k:"debug",l:"🔍 Debug"}];
  const subTabs=[{k:"employees",l:"👥 Employees"},{k:"mapping",l:"🗺 HI Mapping"},{k:"cloning",l:"🔑 Cloning"}];

  return (
    <div style={{maxWidth:1200,margin:"0 auto",padding:20}}>
      <div style={{marginBottom:18}}><h2 style={{fontSize:17,fontWeight:700,color:"#111827",margin:0}}>Admin Panel</h2><p style={{fontSize:11,color:"#9ca3af",marginTop:2}}>Manage org data and metrics</p></div>
      {msg&&<div style={{padding:"9px 12px",borderRadius:8,marginBottom:14,fontSize:12,fontWeight:500,background:msg.startsWith("✅")?"#f0fdf4":"#fef2f2",color:msg.startsWith("✅")?"#16a34a":"#dc2626",border:"1px solid "+(msg.startsWith("✅")?"#bbf7d0":"#fecaca")}}>{msg}</div>}
      {!xlsxReady&&<div style={{padding:"8px 12px",borderRadius:8,marginBottom:14,fontSize:12,background:"#fff7ed",color:"#92400e",border:"1px solid #fde68a"}}>⏳ Loading SheetJS…</div>}
      <div style={{display:"flex",gap:2,marginBottom:14,background:"#f3f4f6",borderRadius:8,padding:2,width:"fit-content"}}>
        {mainTabs.map(({k,l})=><button key={k} onClick={()=>setTab(k)} style={{padding:"5px 14px",borderRadius:6,border:"none",cursor:"pointer",fontSize:12,fontWeight:500,background:tab===k?"#fff":"transparent",color:tab===k?"#2563eb":"#6b7280",boxShadow:tab===k?"0 1px 3px rgba(0,0,0,.1)":"none"}}>{l}</button>)}
      </div>

      {tab==="data"&&(
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div style={{background:"#fff",borderRadius:14,border:"1px solid #e5e7eb",padding:18,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
            <h3 style={{fontSize:13,fontWeight:700,color:"#111827",marginBottom:3}}>Upload Organisation File</h3>
            <p style={{fontSize:11,color:"#6b7280",marginBottom:14}}>Single Excel with 3 sheets: <strong>Employees</strong>, <strong>HI_Hub_Mapping</strong>, <strong>Access_Cloning</strong>.</p>
            <div style={{display:"flex",gap:7,flexWrap:"wrap",alignItems:"center",marginBottom:14}}>
              <button onClick={()=>dlXlsx([{rows:[],cols:USER_COLS,name:"Employees"},{rows:[],cols:MAPPING_COLS,name:"HI_Hub_Mapping"},{rows:[],cols:CLONE_COLS,name:"Access_Cloning"}],"org_template.xlsx")} style={B("#16a34a")} disabled={!xlsxReady}>⬇ Template</button>
              <label style={{...B("#2563eb"),cursor:xlsxReady?"pointer":"not-allowed",opacity:xlsxReady?1:.5}}>⬆ Upload<input type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={handleOrgUpload} disabled={!xlsxReady}/></label>
              {userRows.length>0&&<button onClick={()=>dlXlsx([{rows:userRows,cols:USER_COLS,name:"Employees"},{rows:mappingRows,cols:MAPPING_COLS,name:"HI_Hub_Mapping"},{rows:cloneRows,cols:CLONE_COLS,name:"Access_Cloning"}],"current_data.xlsx")} style={B("#7c3aed")} disabled={!xlsxReady}>⬇ Current Data</button>}
              {val?.fail?.length>0&&<button onClick={()=>dlXlsx([{rows:val.fail.map(r=>({...r,Error:!val.allE.has((r.HI_Email||"").toLowerCase().trim())?"Not in Employees":"Not leaf HI"})),cols:[...MAPPING_COLS,"Error"],name:"Failed"}],"failed_rows.xlsx")} style={B("#dc2626")} disabled={!xlsxReady}>⬇ Failed ({val.fail.length})</button>}
            </div>
            <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:8,padding:10,marginBottom:14,fontSize:11,color:"#166534"}}>ℹ️ <strong>Admin access</strong> is granted via <strong>Designation = ADMIN</strong> in the Access_Cloning sheet.</div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
              {[{l:"Sheet 1: Employees",c:USER_COLS,col:"#2563eb"},{l:"Sheet 2: HI_Hub_Mapping",c:MAPPING_COLS,col:"#7c3aed"},{l:"Sheet 3: Access_Cloning",c:CLONE_COLS,col:"#d97706"}].map(({l,c,col})=>(
                <div key={l} style={{flex:1,minWidth:180,background:"#f9fafb",borderRadius:8,border:"1px solid #e5e7eb",padding:10}}>
                  <p style={{fontSize:11,fontWeight:700,color:col,marginBottom:6}}>{l}</p>
                  <div style={{display:"flex",flexWrap:"wrap",gap:3}}>{c.map(x=><span key={x} style={{padding:"1px 7px",borderRadius:99,fontSize:10,fontWeight:600,background:col+"15",color:col}}>{x}</span>)}</div>
                </div>
              ))}
            </div>
          </div>
          {val&&(
            <div style={{background:"#fff",borderRadius:14,border:"1px solid #e5e7eb",overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
              <div style={{display:"flex",borderBottom:"1px solid #e5e7eb",background:"#f9fafb"}}>
                {subTabs.map(({k,l})=><button key={k} onClick={()=>setDSub(k)} style={{padding:"9px 16px",border:"none",borderBottom:dSub===k?"2px solid #2563eb":"2px solid transparent",background:"transparent",cursor:"pointer",fontSize:12,fontWeight:500,color:dSub===k?"#2563eb":"#6b7280",marginBottom:-1}}>{l}</button>)}
                <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6,padding:"0 14px"}}>
                  <span style={{padding:"2px 9px",borderRadius:99,fontSize:10,fontWeight:700,background:"#dcfce7",color:"#16a34a"}}>✓ {val.pass.length} valid</span>
                  {val.fail.length>0&&<span style={{padding:"2px 9px",borderRadius:99,fontSize:10,fontWeight:700,background:"#fee2e2",color:"#dc2626"}}>⚠ {val.fail.length} failed</span>}
                </div>
              </div>
              {dSub==="employees"&&<PaginatedTable rows={val.uR} cols={USER_COLS} colorFn={c=>({color:c.includes("Email")?"#6b7280":"#111827"})}/>}
              {dSub==="mapping"&&(
                <div>
                  {val.fail.length>0&&<div style={{padding:"8px 12px",background:"#fff7ed",borderBottom:"1px solid #fde68a",fontSize:11,color:"#92400e"}}><strong>Issues:</strong> Failed rows shown first.</div>}
                  <PaginatedTable rows={[...val.fail.map(r=>({...r,_bg:"#fff7ed",_hoverBg:"#fef3c7",_f:true})),...val.pass]} cols={MAPPING_COLS} colorFn={(c,r)=>({color:c.includes("Email")?"#6b7280":"#111827",fontWeight:r._f&&c==="HI_Email"?700:400})} extraCols={[{label:"Status",render:r=>r._f?<span style={{padding:"1px 7px",borderRadius:99,fontSize:10,fontWeight:700,background:"#fee2e2",color:"#dc2626"}}>⚠ {!val.allE.has((r.HI_Email||"").toLowerCase().trim())?"Not in Employees":"Not leaf HI"}</span>:<span style={{padding:"1px 7px",borderRadius:99,fontSize:10,fontWeight:700,background:"#dcfce7",color:"#16a34a"}}>✓ OK</span>}]}/>
                </div>
              )}
              {dSub==="cloning"&&(
                <div>
                  <div style={{padding:"8px 12px",background:"#fffbeb",borderBottom:"1px solid #fde68a",fontSize:11,color:"#92400e"}}><strong>Designation = ADMIN</strong> → Dashboard + Admin Panel access.</div>
                  {val.cR.length===0?<div style={{padding:32,textAlign:"center",color:"#9ca3af",fontSize:12}}>No cloning entries.</div>:<PaginatedTable rows={val.cR} cols={CLONE_COLS} colorFn={c=>({color:c.includes("Email")?"#6b7280":"#111827"})} extraCols={[{label:"Access",render:r=>(r.Designation||"").toUpperCase()==="ADMIN"?<span style={{padding:"1px 7px",borderRadius:99,fontSize:10,fontWeight:700,background:"#dbeafe",color:"#2563eb"}}>🔑 Dashboard + Admin</span>:<span style={{padding:"1px 7px",borderRadius:99,fontSize:10,fontWeight:700,background:"#f3f4f6",color:"#374151"}}>📊 Dashboard only</span>}]}/>}
                </div>
              )}
            </div>
          )}
        </div>
      )}

      {tab==="metrics"&&(
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div style={{background:"#fff",borderRadius:14,border:"1px solid #e5e7eb",padding:18,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
            <h3 style={{fontSize:13,fontWeight:700,color:"#111827",marginBottom:3}}>Upload Metrics File</h3>
            <p style={{fontSize:11,color:"#6b7280",marginBottom:14}}>Excel with sheets: <strong>Reliability, Experience, Loss, Efficiency, Cost</strong> + optional <strong>Targets</strong>.</p>
            <div style={{display:"flex",gap:7,flexWrap:"wrap",alignItems:"center",marginBottom:14}}>
              <button onClick={()=>dlXlsx([{rows:[],cols:RELIABILITY_COLS,name:"Reliability"},{rows:[],cols:EXPERIENCE_COLS,name:"Experience"},{rows:[],cols:LOSS_COLS,name:"Loss"},{rows:[],cols:EFFICIENCY_COLS,name:"Efficiency"},{rows:[],cols:COST_COLS,name:"Cost"},{rows:[],cols:TARGET_COLS,name:"Targets"}],"metrics_template.xlsx")} style={B("#16a34a")} disabled={!xlsxReady}>⬇ Template</button>
              <label style={{...B("#2563eb"),cursor:xlsxReady?"pointer":"not-allowed",opacity:xlsxReady?1:.5}}>⬆ Upload Metrics<input type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={handleMetricsUpload} disabled={!xlsxReady}/></label>
              {rR.length>0&&(<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{[["📊",rR.length,"Rel","#2563eb","#dbeafe"],["📈",eR.length,"Exp","#7c3aed","#ede9fe"],["💸",lR.length,"Loss","#e11d48","#fff1f2"],["⚡",efR.length,"Eff","#d97706","#fffbeb"],["💰",cR.length,"Cost","#0d9488","#f0fdfa"],["🎯",tR.length,"Tgts","#059669","#d1fae5"]].map(([ic,cnt,lb,col,bg])=>(<span key={lb} style={{padding:"3px 10px",borderRadius:99,fontSize:11,fontWeight:600,background:bg,color:col}}>{ic} {cnt} {lb}</span>))}</div>)}
            </div>
            <div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:8,padding:10,marginBottom:14,fontSize:11,color:"#78350f"}}><strong>Targets sheet columns:</strong> Facility_ID, Metric_Name, Target_Value, Effective_From, Effective_To — overrides Admin Panel defaults per hub + date range.</div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
              {[{l:"Reliability",c:RELIABILITY_COLS,col:"#2563eb"},{l:"Experience",c:EXPERIENCE_COLS,col:"#7c3aed"},{l:"Loss",c:LOSS_COLS,col:"#e11d48"},{l:"Efficiency",c:EFFICIENCY_COLS,col:"#d97706"},{l:"Cost",c:COST_COLS,col:"#0d9488"},{l:"Targets (opt.)",c:TARGET_COLS,col:"#059669"}].map(({l,c,col})=>(
                <div key={l} style={{flex:1,minWidth:160,background:"#f9fafb",borderRadius:8,border:"1px solid #e5e7eb",padding:10}}>
                  <p style={{fontSize:11,fontWeight:700,color:col,marginBottom:5}}>{l}</p>
                  <div style={{display:"flex",flexWrap:"wrap",gap:3}}>{c.map(x=><span key={x} style={{padding:"1px 6px",borderRadius:99,fontSize:9,fontWeight:600,background:col+"15",color:col}}>{x}</span>)}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {tab==="targets"&&(
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div style={{background:"#fff",borderRadius:14,border:"1px solid #e5e7eb",padding:18,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
              <h3 style={{fontSize:13,fontWeight:700,color:"#111827",margin:0}}>Global Default Targets</h3>
              <button onClick={saveAT} style={{...B("#2563eb")}}>{atSaved?"✅ Saved":"💾 Save"}</button>
            </div>
            <p style={{fontSize:11,color:"#6b7280",marginBottom:16}}>Fallback targets when no hub-specific target is found. Leave blank to disable comparison for a metric.</p>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {METRIC_GROUPS.map(g=>(
                <div key={g.label} style={{border:"1px solid "+g.border,borderRadius:10,overflow:"hidden"}}>
                  <div style={{background:g.color,color:"#fff",padding:"7px 14px",fontSize:11,fontWeight:700,letterSpacing:".05em",textTransform:"uppercase"}}>{g.label}</div>
                  <div style={{padding:12,background:g.bg}}>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:10}}>
                      {g.metrics.map(m=>{ const curr=aT[m]; return (
                        <div key={m} style={{background:"#fff",borderRadius:7,border:"1px solid "+g.border,padding:"9px 10px"}}>
                          <div style={{fontSize:10,fontWeight:600,color:g.color,marginBottom:5,textTransform:"uppercase",letterSpacing:".04em"}}>{m}</div>
                          <div style={{display:"flex",alignItems:"center",gap:6}}>
                            <input type="number" step="any" value={editAT[m]} onChange={e=>setEditAT(p=>({...p,[m]:e.target.value}))} placeholder="No target" style={{flex:1,border:"1px solid #e5e7eb",borderRadius:5,padding:"4px 7px",fontSize:12,outline:"none"}}/>
                            <span style={{fontSize:10,color:"#9ca3af"}}>{getUnit(m)||"₹"}</span>
                          </div>
                          {curr!=null&&<div style={{fontSize:10,color:"#9ca3af",marginTop:3}}>Current: {fmt(curr,m)}</div>}
                        </div>
                      );})}
                    </div>
                  </div>
                </div>
              ))}
            </div>
            <div style={{marginTop:14,display:"flex",justifyContent:"flex-end"}}><button onClick={saveAT} style={{...B("#2563eb"),fontSize:12,padding:"7px 22px"}}>{atSaved?"✅ Saved!":"💾 Save All Targets"}</button></div>
          </div>
          {tR.length>0&&(
            <div style={{background:"#fff",borderRadius:14,border:"1px solid #e5e7eb",overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
              <div style={{padding:"10px 16px",borderBottom:"1px solid #e5e7eb",background:"#f9fafb",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <h3 style={{fontSize:12,fontWeight:700,color:"#374151",margin:0}}>Uploaded Hub Targets ({tR.length} rows)</h3>
                <span style={{fontSize:11,color:"#9ca3af"}}>Override admin defaults per hub + date range</span>
              </div>
              <PaginatedTable rows={tR} cols={TARGET_COLS} colorFn={c=>({color:c==="Target_Value"?"#2563eb":"#111827",fontWeight:c==="Target_Value"?700:400})}/>
            </div>
          )}
        </div>
      )}

      {tab==="debug"&&(
        <div style={{background:"#fff",borderRadius:14,border:"1px solid #e5e7eb",padding:18,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
          <h3 style={{fontSize:13,fontWeight:700,color:"#111827",marginBottom:14}}>🔍 Debug Info</h3>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            <div style={{background:"#f9fafb",borderRadius:8,border:"1px solid #e5e7eb",padding:12}}>
              <div style={{fontWeight:700,fontSize:12,color:"#374151",marginBottom:8}}>Loaded Data</div>
              {[["Employees",userRows.length],["HI Mappings",mappingRows.length],["Reliability",rR.length],["Experience",eR.length],["Loss",lR.length],["Efficiency",efR.length],["Cost",cR.length],["Targets",tR.length]].map(([k,v])=>(<div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:11,padding:"3px 0",borderBottom:"1px solid #f3f4f6"}}><span style={{color:"#6b7280"}}>{k}</span><span style={{fontWeight:600,color:"#111827",fontFamily:"monospace"}}>{v}</span></div>))}
            </div>
            <div style={{background:"#fffbeb",borderRadius:8,border:"1px solid #fde68a",padding:12}}>
              <div style={{fontWeight:700,fontSize:12,color:"#92400e",marginBottom:8}}>FID Match Check</div>
              {(()=>{ const mFids=new Set(mappingRows.map(r=>String(r.Facility_ID||"").trim())); return [["Reliability",rR],["Experience",eR],["Loss",lR],["Efficiency",efR],["Cost",cR]].map(([name,raw])=>{ const fids=new Set(raw.map(r=>String(r.Facility_ID||"").trim())); const match=[...mFids].filter(f=>fids.has(f)).length; return <div key={name} style={{display:"flex",justifyContent:"space-between",fontSize:11,padding:"3px 0",borderBottom:"1px solid #fde68a"}}><span style={{color:"#92400e"}}>Mapping ∩ {name}</span><span style={{fontWeight:700,fontFamily:"monospace",color:match>0?"#16a34a":"#dc2626"}}>{match}/{mFids.size}</span></div>; }); })()}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Root App ─────────────────────────────────────────────────────────────────
function App() {
  const xlsxReady = useXLSX();
  const [user,setUser]=useState(null);
  const [login,setLogin]=useState({email:"",password:""});
  const [loginErr,setLoginErr]=useState("");
  const [mainTab,setMainTab]=useState("dashboard");
  const [period,setPeriod]=useState("MTD");
  const [customRange,setCustomRange]=useState({from:"",to:""});
  const [showCustom,setShowCustom]=useState(false);
  // ITEM 2: week selection state - default to last full week
  const [weekSel,setWeekSel]=useState(()=>getLastFullWeek());
  const [hier,setHier]=useState({});
  const [userRows,setUserRows]=useState([]);
  const [mappingRows,setMappingRows]=useState([]);
  const [cloneRows,setCloneRows]=useState([]);
  const [rR,setRR]=useState([]); const [eR,setER]=useState([]); const [lR,setLR]=useState([]); const [efR,setEfR]=useState([]); const [cR,setCR]=useState([]);
  const [tR,setTR]=useState([]); const [aT,setAT]=useState({});

  const hiMap = useMemo(()=>buildHIHubMap(mappingRows),[mappingRows]);
  const dr = useMemo(()=>getDateRange(period,customRange,weekSel),[period,customRange,weekSel]);

  const cloneMap = useMemo(()=>{
    const m={};
    cloneRows.forEach(r=>{
      const le=(r.Emp_Email||"").toLowerCase().trim();
      const ce=(r.Clone_Email||"").toLowerCase().trim();
      const desig=(r.Designation||"").toUpperCase().trim();
      if(le&&ce) m[le]={cloneEmail:ce,isAdmin:desig==="ADMIN",displayName:r.Emp_Name||le.split("@")[0]};
    });
    return m;
  },[cloneRows]);

  const resolveClone = useCallback((email,visited=new Set())=>{
    if(visited.has(email)) return null; visited.add(email);
    const entry=cloneMap[email]; if(!entry) return null;
    const ce=entry.cloneEmail, ceId=emailToId(ce);
    if(hier[ceId]) return {cloneId:ceId,cloneEmail:ce,isAdmin:entry.isAdmin,displayName:entry.displayName};
    return resolveClone(ce,visited);
  },[cloneMap,hier]);

  const handleOrgUpload=(uR,mR,cR2)=>{ setUserRows(uR); setMappingRows(mR); setCloneRows(cR2); const built=buildHierarchyFromUsers(uR); if(built) setHier(built); };

  const doLogin=()=>{
    const email=login.email.trim().toLowerCase(), pw=login.password.trim();
    if(!email||!pw){setLoginErr("Enter email and password.");return;}
    if(email===BOOTSTRAP_ADMIN.email&&pw===BOOTSTRAP_ADMIN.password){setUser(BOOTSTRAP_ADMIN);setLoginErr("");return;}
    const clone=cloneMap[email];
    if(clone){
      const res=resolveClone(email); if(!res){setLoginErr("Access not configured.");return;}
      const n=hier[res.cloneId]; if(!n){setLoginErr("Cloned user not in hierarchy.");return;}
      setUser({email,name:res.displayName,id:res.cloneId,role:n.title,isCloned:true,cloneOf:res.cloneEmail,hasAdminAccess:res.isAdmin,hasDashAccess:true}); setLoginErr(""); return;
    }
    const empId=emailToId(email), node=hier[empId];
    if(!node){setLoginErr("Invalid email or password.");return;}
    setUser({email,name:node.name,id:empId,role:node.title,hasAdminAccess:false,hasDashAccess:true}); setLoginErr("");
  };

  const doLogout=()=>{setUser(null);setLogin({email:"",password:""});setMainTab("dashboard");};

  const today=new Date(); const yday=new Date(today); yday.setDate(today.getDate()-1);
  const getDateLabel=()=>{
    if(period==="Daily") return "Data as of: "+fmtDateFull(yday);
    if(period==="Weekly"&&weekSel) return `W${weekSel.weekNum}: ${fmtDateFull(weekSel.start)} – ${fmtDateFull(weekSel.end)}`;
    if(period==="MTD"){const s=new Date(today.getFullYear(),today.getMonth(),1);return "Data for: "+fmtDateFull(s)+" – "+fmtDateFull(today);}
    if(period==="YTD"){const s=new Date(today.getFullYear(),0,1);return "Data for: "+fmtDateFull(s)+" – "+fmtDateFull(today);}
    if(period==="Custom"&&customRange.from&&customRange.to) return "Data for: "+fmtDateFull(new Date(customRange.from))+" – "+fmtDateFull(new Date(customRange.to));
    return "Select a date range";
  };

  if(!user) return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#1e293b,#0f172a)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"#fff",borderRadius:20,boxShadow:"0 25px 60px rgba(0,0,0,.3)",width:"100%",maxWidth:370,padding:32}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{width:52,height:52,background:"#2563eb",borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 10px",fontSize:22,fontWeight:700,color:"#fff"}}>V</div>
          <h1 style={{fontSize:19,fontWeight:700,color:"#111827",margin:0}}>Vantage Ops</h1>
          <p style={{fontSize:12,color:"#9ca3af",marginTop:3}}>Last Mile Intelligence Platform</p>
        </div>
        {[["Email","email","email","your@email.com"],["Password","password","password","••••••••"]].map(([lbl,key,type,ph])=>(
          <div key={key} style={{marginBottom:12}}>
            <label style={{fontSize:10,fontWeight:600,color:"#6b7280",textTransform:"uppercase",letterSpacing:".05em"}}>{lbl}</label>
            <input type={type} value={login[key]} placeholder={ph} onChange={e=>setLogin(p=>({...p,[key]:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&doLogin()} style={{width:"100%",marginTop:3,padding:"9px 11px",border:"1px solid #e5e7eb",borderRadius:7,fontSize:13,outline:"none",boxSizing:"border-box"}}/>
          </div>
        ))}
        {loginErr&&<p style={{color:"#dc2626",fontSize:11,marginBottom:6}}>{loginErr}</p>}
        <button onClick={doLogin} style={{width:"100%",padding:10,background:"#2563eb",color:"#fff",border:"none",borderRadius:7,fontSize:13,fontWeight:600,cursor:"pointer",marginTop:6}}>Sign In</button>
      </div>
    </div>
  );

  const isAdmin=user.hasAdminAccess===true;
  const bootstrapAdmin=user.id===BOOTSTRAP_ADMIN.id;
  const node=!bootstrapAdmin?hier[user.id]:null;
  const showBoth=isAdmin&&!bootstrapAdmin;

  const adminPanel=(
    <AdminPage hier={hier} userRows={userRows} mappingRows={mappingRows} cloneRows={cloneRows} onOrgUpload={handleOrgUpload}
      rR={rR} onRR={setRR} eR={eR} onER={setER} lR={lR} onLR={setLR} efR={efR} onEfR={setEfR} cR={cR} onCR={setCR}
      tR={tR} onTR={setTR} aT={aT} setAT={setAT}/>
  );
  const dashPanel=node
    ? <DashboardView userId={user.id} node={node} period={period} setPeriod={setPeriod} weekSel={weekSel} setWeekSel={setWeekSel} showCustom={showCustom} setShowCustom={setShowCustom} customRange={customRange} setCustomRange={setCustomRange} hier={hier} hiMap={hiMap} rR={rR} eR={eR} lR={lR} efR={efR} cR={cR} dr={dr} getDateLabel={getDateLabel} tR={tR} aT={aT}/>
    : <main style={{maxWidth:1200,margin:"0 auto",padding:40,textAlign:"center"}}><div style={{background:"#fff",borderRadius:14,border:"1px solid #e5e7eb",padding:40,display:"inline-block"}}><div style={{fontSize:36,marginBottom:10}}>📂</div><h3 style={{fontSize:15,fontWeight:700,color:"#374151",margin:"0 0 6px"}}>No Data Available</h3><p style={{fontSize:12,color:"#9ca3af"}}>Ask your admin to upload organisation data.</p></div></main>;

  const header=(
    <header style={{background:"#fff",borderBottom:"1px solid #e5e7eb",position:"sticky",top:0,zIndex:100,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
      <div style={{maxWidth:1200,margin:"0 auto",padding:"10px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:7}}>
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          <div style={{width:32,height:32,background:"#2563eb",borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:14}}>V</div>
          <div><div style={{fontWeight:700,color:"#111827",fontSize:14,lineHeight:1}}>Vantage Ops</div><div style={{fontSize:10,color:"#9ca3af",marginTop:1}}>{node?.title||user.role}</div></div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:7}}>
          {showBoth&&(<div style={{display:"flex",background:"#f3f4f6",borderRadius:7,padding:2,gap:2}}>{[{k:"dashboard",l:"📊 Dashboard"},{k:"admin",l:"⚙️ Admin"}].map(({k,l})=>(<button key={k} onClick={()=>setMainTab(k)} style={{padding:"4px 12px",borderRadius:5,border:"none",cursor:"pointer",fontSize:11,fontWeight:500,background:mainTab===k?"#fff":"transparent",color:mainTab===k?"#2563eb":"#6b7280",boxShadow:mainTab===k?"0 1px 3px rgba(0,0,0,.1)":"none"}}>{l}</button>))}</div>)}
          {isAdmin&&<span style={{padding:"1px 9px",borderRadius:99,fontSize:10,fontWeight:700,background:"#dbeafe",color:"#2563eb"}}>ADMIN</span>}
          <Avatar name={user.name} size={28}/>
          <span style={{fontSize:12,fontWeight:500,color:"#374151"}}>{user.name}</span>
          {user.isCloned&&<span style={{padding:"1px 7px",borderRadius:99,fontSize:10,fontWeight:600,background:"#fef3c7",color:"#d97706"}}>👁 {user.cloneOf}</span>}
          <button onClick={doLogout} style={{fontSize:11,color:"#9ca3af",background:"none",border:"none",cursor:"pointer"}}>Sign out</button>
        </div>
      </div>
    </header>
  );

  let content;
  if(bootstrapAdmin) content=adminPanel;
  else if(showBoth) content=mainTab==="admin"?adminPanel:dashPanel;
  else if(isAdmin) content=adminPanel;
  else content=dashPanel;

  return <div style={{minHeight:"100vh",background:"#f3f4f6"}}>{header}{content}</div>;
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
